# This is a Databricks asset bundle definition for ecom_bronze_ingestion_pipeline_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ecom_bronze_ingestion_pipeline_bundle
  uuid: 8f66101c-fde7-46cf-80a6-8e2e8f84e8d5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8e5380d8-573a.cloud.databricks.com
    variables:
      catalog: enterprise_dwh_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-8e5380d8-573a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rpawar707@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rpawar707@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: enterprise_dwh_dev
      schema: prod
    permissions:
      - user_name: rpawar707@outlook.com
        level: CAN_MANAGE
